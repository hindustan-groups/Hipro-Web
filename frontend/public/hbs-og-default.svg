<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="12" fill="url(#amberGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Brand Badge -->
  <g transform="translate(100, 100)">
    <rect width="90" height="90" fill="#ffffff" stroke="#f59e0b" stroke-width="4" rx="8"/>
    <image href="/hbs-icon.jpg" x="5" y="5" width="80" height="80" preserveAspectRatio="xMidYMid meet"/>
    <text x="120" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="2">HIND BUILD</text>
    <text x="120" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f59e0b" letter-spacing="4">REPAIR · MAINTENANCE · PROTECTION</text>
  </g>

  <!-- Headline -->
  <g transform="translate(100, 260)">
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Complete Building Repair,</text>
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#f59e0b" letter-spacing="-1">Maintenance &amp; Engineering Care</text>
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Turnkey structural rehabilitation, waterproofing, and 19 specialized services across Rajasthan.</text>
  </g>

  <!-- Parent Trust Footer -->
  <g transform="translate(100, 530)">
    <rect width="450" height="46" fill="#1e293b" rx="4"/>
    <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">A Specialized Division of Hindustan Projects (HiPRO)</text>
  </g>

  <!-- URL Tag -->
  <g transform="translate(750, 545)">
    <text x="350" y="10" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#f59e0b" text-anchor="end">hindbuilding.hindustanprojects.in</text>
  </g>
</svg>
