    <path d="M12 12 H26 V18 H22 V31 H36 V18 H32 V12 H46 V18 H42 V46 H46 V52 H32 V46 H36 V36 H22 V46 H26 V52 H12 V46 H16 V18 H12 V12 Z" fill="#E31B23" />
    
    <!-- Red 'i' -->
    <!-- Dot on top -->
    <circle cx="53" cy="18" r="4.8" fill="#E31B23" />
    <!-- Rounded vertical stem below -->
    <rect x="48.5" y="27" width="9" height="24" rx="4.5" fill="#E31B23" />
    
    <!-- Crisp White 'BUILD' -->
    <g fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5px">
