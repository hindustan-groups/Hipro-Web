version: 2
updates:
  # Routine automated version updates disabled (limit: 0) to prevent breaking major dependency upgrades.
  # Security advisories and vulnerability alerts remain fully active in GitHub Security tab.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
